name: stagelink

x-service-environment: &service-environment
  DJANGO_DEBUG: "${DJANGO_DEBUG:-true}"
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-only-django-secret-key-change-before-production-0123456789}"
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,identity,offers,applications,internships,notifications}"
  DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
  SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-false}"
  SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
  SECURE_PROXY_SSL_HEADER: "${SECURE_PROXY_SSL_HEADER:-false}"
  DATABASE_CONN_MAX_AGE: "60"

  # Shared JWT and service-to-service authentication.
  JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-dev-only-user-jwt-signing-key-change-me-0123456789}"
  INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-dev-only-internal-service-token-change-me}"

  # All containers use PostgreSQL in Compose. Each service still has its own
  # database, created by its dedicated db-<service> container.
  DB_ENGINE: django.db.backends.postgresql
  DB_USER: "${POSTGRES_USER:-stagelink}"
  DB_PASSWORD: "${POSTGRES_PASSWORD:-stagelink}"
  DB_PORT: "5432"

x-postgres-environment: &postgres-environment
  POSTGRES_USER: "${POSTGRES_USER:-stagelink}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-stagelink}"

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 5s
  retries: 10

x-service-healthcheck: &service-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  identity:
    build:
      context: ../../services/identity
    ports:
      - "8001:8000"
    environment:
      <<: *service-environment
      DB_NAME: identity
      DB_HOST: db-identity
      # Used only by `manage.py seed_demo` to create the demo offer.
      OFFERS_BASE_URL: "http://offers:8000"
      # Generous local limits so demos and integration tests are not throttled.
      # Use 10/hour and 10/minute in production.
      LOGIN_THROTTLE_RATE: "${LOGIN_THROTTLE_RATE:-1000/minute}"
      REGISTER_THROTTLE_RATE: "${REGISTER_THROTTLE_RATE:-1000/hour}"
    depends_on:
      db-identity:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped

  db-identity:
    image: postgres:16
    environment:
      <<: *postgres-environment
      POSTGRES_DB: identity
    volumes:
      - identity-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    restart: unless-stopped

  offers:
    build:
      context: ../../services/offers
    ports:
      - "8002:8000"
    environment:
      <<: *service-environment
      DB_NAME: offers
      DB_HOST: db-offers
      # Committed-places snapshot before a published capacity reduction.
      APPLICATIONS_BASE_URL: "http://applications:8000"
    depends_on:
      db-offers:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped

  db-offers:
    image: postgres:16
    environment:
      <<: *postgres-environment
      POSTGRES_DB: offers
    volumes:
      - offers-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    restart: unless-stopped

  # Closes published offers whose deadline passed. The command is idempotent,
  # so a failed run is simply retried on the next interval.
  scheduler-offers:
    build:
      context: ../../services/offers
    command:
      - sh
      - -c
      - |
        while true; do
          python manage.py close_expired_offers || true
          sleep 300
        done
    environment:
      <<: *service-environment
      DB_NAME: offers
      DB_HOST: db-offers
      APPLICATIONS_BASE_URL: "http://applications:8000"
    depends_on:
      db-offers:
        condition: service_healthy
      offers:
        condition: service_healthy
    restart: unless-stopped

  applications:
    build:
      context: ../../services/applications
    ports:
      - "8003:8000"
    environment:
      <<: *service-environment
      DB_NAME: applications
      DB_HOST: db-applications
      INTERNSHIP_SERVICE_URL: "${INTERNSHIP_SERVICE_URL:-http://internships:8000/api/internal/internships/}"
      # Intake validation and capacity checks use the Offers internal lookup.
      OFFERS_SERVICE_URL: "http://offers:8000/api/internal/offers/"
      # Notifications are best effort and sent after commit.
      NOTIFICATIONS_BASE_URL: "http://notifications:8000"
      # University-administrator recipients are resolved from the Identity
      # directory after commit; the env list is only an outage fallback.
      IDENTITY_BASE_URL: "http://identity:8000"
      UNIVERSITY_ADMIN_USER_IDS: "${UNIVERSITY_ADMIN_USER_IDS:-}"
    depends_on:
      db-applications:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped

  db-applications:
    image: postgres:16
    environment:
      <<: *postgres-environment
      POSTGRES_DB: applications
    volumes:
      - applications-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    restart: unless-stopped

  # Retries applications stuck in STUDENT_ACCEPTED because the Internships call
  # failed. The internship endpoint is idempotent, so retries are safe.
  scheduler-applications:
    build:
      context: ../../services/applications
    command:
      - sh
      - -c
      - |
        while true; do
          python manage.py reconcile_confirmed_applications --limit 100 --older-than 60 || true
          sleep 300
        done
    environment:
      <<: *service-environment
      DB_NAME: applications
      DB_HOST: db-applications
      INTERNSHIP_SERVICE_URL: "${INTERNSHIP_SERVICE_URL:-http://internships:8000/api/internal/internships/}"
      OFFERS_SERVICE_URL: "http://offers:8000/api/internal/offers/"
      NOTIFICATIONS_BASE_URL: "http://notifications:8000"
      IDENTITY_BASE_URL: "http://identity:8000"
      UNIVERSITY_ADMIN_USER_IDS: "${UNIVERSITY_ADMIN_USER_IDS:-}"
    depends_on:
      db-applications:
        condition: service_healthy
      applications:
        condition: service_healthy
    restart: unless-stopped

  internships:
    build:
      context: ../../services/internships
    ports:
      - "8004:8000"
    environment:
      <<: *service-environment
      DB_NAME: internships
      DB_HOST: db-internships
      IDENTITY_BASE_URL: "http://identity:8000"
      # Uploaded student submissions live on a named volume so they survive
      # container recreation. They are never served directly.
      MEDIA_ROOT: "/app/media"
      MAX_SUBMISSION_SIZE_BYTES: "${MAX_SUBMISSION_SIZE_BYTES:-10485760}"
      NOTIFICATIONS_BASE_URL: "http://notifications:8000"
      APPLICATIONS_BASE_URL: "http://applications:8000"
      # Recipients are resolved from Identity after commit; the env list is
      # only an outage fallback.
      UNIVERSITY_ADMIN_USER_IDS: "${UNIVERSITY_ADMIN_USER_IDS:-}"
    volumes:
      - internships-media:/app/media
    depends_on:
      db-internships:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped

  db-internships:
    image: postgres:16
    environment:
      <<: *postgres-environment
      POSTGRES_DB: internships
    volumes:
      - internships-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    restart: unless-stopped

  notifications:
    build:
      context: ../../services/notifications
    ports:
      - "8005:8000"
    environment:
      <<: *service-environment
      DB_NAME: notifications
      DB_HOST: db-notifications
    depends_on:
      db-notifications:
        condition: service_healthy
    healthcheck: *service-healthcheck
    restart: unless-stopped

  db-notifications:
    image: postgres:16
    environment:
      <<: *postgres-environment
      POSTGRES_DB: notifications
    volumes:
      - notifications-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    restart: unless-stopped

volumes:
  identity-data:
  offers-data:
  applications-data:
  internships-data:
  internships-media:
  notifications-data:
