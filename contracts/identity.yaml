openapi: 3.0.3

info:
  title: STAGELINK Identity API
  version: 0.4.0
  description: |
    HTTP contract for the STAGELINK identity service.

    This file is the source of truth for the service interface. Add or change
    operations here before implementing them in Django. See
    docs/api-conventions.md for shared rules.

    Identifiers are UUID strings. Role values are lowercase snake_case.
    User endpoints require a bearer access token. Internal endpoints require
    the shared X-Service-Token header. Company verification endpoints require
    a `platform_admin`. User provisioning and management endpoints accept a
    `platform_admin` (all roles) or a `university_admin` (students and
    supervisors of the same university only).

    Error responses follow Django REST Framework conventions, not the shared
    `{code, message, details}` envelope used by the other services. Detail
    failures return `{"detail": "..."}`; validation failures return an object
    mapping field names (or `non_field_errors`) to one message or a list of
    messages.

  contact:
    name: STAGELINK maintainers

servers:
  - url: http://localhost:8001
    description: Local development
  - url: https://api.stagelink.example/identity
    description: Reserved production URL

tags:
  - name: System
    description: Operational endpoints used by infrastructure.
  - name: Authentication
    description: Registration, login and token refresh.
  - name: Profiles
    description: Authenticated user profile, role profile and user directory operations.
  - name: Companies
    description: Public company profile and verification status endpoints.
  - name: Internal
    description: Trusted service-to-service endpoints.
  - name: Admin
    description: Platform-administrator account and company management.

paths:
  /health/:
    get:
      tags:
        - System
      operationId: getIdentityHealth
      summary: Report service health
      description: Returns the current liveness status of the identity service.
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/auth/register/:
    post:
      tags:
        - Authentication
      operationId: registerUser
      summary: Register a company account
      description: |
        Public registration is limited to the `company` role. Students,
        supervisors and administrators must be provisioned by an administrator.
        Company accounts are created inactive until a platform administrator
        verifies and activates them. The company name, legal form, registration
        number, location and phone are stored on the company profile so the
        administrator can verify the submitted details.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login/:
    post:
      tags:
        - Authentication
      operationId: loginUser
      summary: Authenticate and issue a token pair
      description: |
        Inactive accounts cannot log in. Company accounts stay inactive until a
        platform administrator verifies them. The issued access and refresh
        tokens carry a `university` claim (empty when the role has no
        institution) so other services can enforce institution scope without a
        per-request directory call.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Credentials are valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/refresh/:
    post:
      tags:
        - Authentication
      operationId: refreshAccessToken
      summary: Exchange a refresh token for a new access token
      description: |
        Refresh tokens rotate: the response also contains a new refresh token,
        and the submitted token is blacklisted. Reusing it returns `401`.
        The rotated tokens re-read the current `university` claim from the
        account's role profile, so institution changes take effect on refresh
        without waiting for the next login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new access token and a rotated refresh token were issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout/:
    post:
      tags:
        - Authentication
      operationId: logout
      summary: Revoke a refresh token
      description: |
        Blacklists the supplied refresh token so it can no longer be exchanged.
        Logging out twice is harmless. The token must belong to the caller.
        Access tokens are stateless and remain valid until they expire.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: The token is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/me/password/:
    post:
      tags:
        - Profiles
      operationId: changePassword
      summary: Change the authenticated user's password
      description: |
        Requires the current password. All refresh tokens issued to the account
        are revoked, so the client must sign in again. The current access token
        stays valid until it expires.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: The password was changed and refresh tokens were revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/deactivate/:
    post:
      tags:
        - Profiles
      operationId: deactivateAccount
      summary: Deactivate the authenticated user's account
      description: |
        Requires the current password. The account can no longer sign in and all
        refresh tokens are revoked. Accounts are not deleted; a platform admin
        can reactivate one through the admin user API.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateAccountRequest'
      responses:
        '200':
          description: The account was deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/:
    get:
      tags:
        - Profiles
      operationId: getCurrentUser
      summary: Read the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Profiles
      operationId: updateCurrentUser
      summary: Update the authenticated user's name or email
      description: |
        Protected fields such as `role`, `is_active` and `date_joined` are
        rejected with a field error when supplied.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/profile/:
    get:
      tags:
        - Profiles
      operationId: getCurrentRoleProfile
      summary: Read the authenticated user's role-specific profile
      description: |
        Returns the profile matching the caller's role. Student, company,
        supervisor and university-administrator accounts have a role-specific
        profile; platform administrators do not.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's role-specific profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - Profiles
      operationId: updateCurrentRoleProfile
      summary: Replace the authenticated user's role-specific profile
      description: |
        Full replacement: every field for the caller's role is required. Unknown
        fields and protected fields are rejected with a field error.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleProfileUpdate'
      responses:
        '200':
          description: The updated role-specific profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/:
    get:
      tags:
        - Profiles
      operationId: listDirectoryUsers
      summary: Search the authenticated user directory
      description: |
        Returns active accounts visible to any authenticated user. The payload
        is visibility-filtered: every caller receives `id`, `name` and `role`;
        supervisors and companies also receive a student's academic line
        (`university`, `department`, `specialty`, `academic_year`). Email,
        phone and `matricule` are returned only to the account owner and to
        university/platform administrators.
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Role'
        - name: q
          in: query
          description: Case-insensitive search over name and email.
          schema:
            type: string
        - name: university
          in: query
          description: Case-insensitive exact match on the university field.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: A page of user summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/lookup/:
    get:
      tags:
        - Profiles
      operationId: lookupUsersByIds
      summary: Resolve user UUIDs to display names in one request
      description: |
        Accepts up to 100 comma-separated UUIDs. Results follow the requested
        order; unknown IDs are omitted. Deactivated users are included so
        historical records can still be rendered. The same field visibility
        rules as the directory apply.
      security:
        - bearerAuth: []
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated user UUIDs (maximum 100).
          schema:
            type: string
      responses:
        '200':
          description: The resolved users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUserLookup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/{user_id}/:
    get:
      tags:
        - Profiles
      operationId: getDirectoryUser
      summary: Read a user from the authenticated directory
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The visibility-filtered user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublicProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/companies/{company_id}/verification/:
    get:
      tags:
        - Companies
      operationId: getCompanyVerification
      summary: Read a company's verification status anonymously
      description: |
        Public and unauthenticated. Unlike the full public profile, this
        endpoint works for pending, active and rejected companies.
      security: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The verification status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyVerification'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/companies/{company_id}/profile/:
    get:
      tags:
        - Companies
      operationId: getPublicCompanyProfile
      summary: Read the public profile of a verified company
      description: |
        Public and unauthenticated. `company_id` is the company user's UUID.
        Only active, verified company accounts are returned; every other state
        returns `404` so unverified accounts are not exposed.
      security: []
      parameters:
        - name: company_id
          in: path
          required: true
          description: UUID of the company user account.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The public company profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCompanyProfile'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/users/:
    get:
      tags:
        - Internal
      operationId: listInternalUsers
      summary: List or batch-look up users for trusted services
      description: |
        Two mutually exclusive modes:

        * Directory mode (`role`, `department`, `university`, `page`):
          paginated list of **active** accounts only. Used to resolve recipients
          such as university administrators, and to resolve the students
          belonging to one institution for tenant scoping.
        * Batch mode (`ids`): resolves up to 100 comma-separated UUIDs in the
          requested order. Accounts are returned regardless of `is_active`, so
          display names keep working for historical records. Unknown IDs are
          omitted. Each result also includes the account's role and institution
          so callers can scope cross-service notifications.

        Pairing `ids` with any other query parameter is a validation error.
        This endpoint is only available with the shared service token; user
        access tokens are rejected.
      security:
        - serviceToken: []
      parameters:
        - name: role
          in: query
          required: false
          description: Directory mode only. Filter by authoritative role.
          schema:
            $ref: '#/components/schemas/Role'
        - name: department
          in: query
          required: false
          description: |
            Directory mode only. Matches the student or supervisor profile
            department.
          schema:
            type: string
            minLength: 1
        - name: university
          in: query
          required: false
          description: |
            Directory mode only. Case-insensitive exact match on the
            institution stored on a student, supervisor or university
            administrator profile.
          schema:
            type: string
            minLength: 1
        - name: page
          in: query
          required: false
          description: Directory mode only. Page number, 20 results per page.
          schema:
            type: integer
            minimum: 1
        - name: ids
          in: query
          required: false
          description: |
            Batch mode only. Comma-separated UUIDs, at most 100. Cannot be
            combined with `role`, `department`, `university` or `page`.
          schema:
            type: string
          example: 1c2d3e4f-0000-0000-0000-000000000001,1c2d3e4f-0000-0000-0000-000000000002
      responses:
        '200':
          description: |
            A paginated directory page (directory mode) or a batch result
            (batch mode).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DirectoryUserPage'
                  - $ref: '#/components/schemas/DirectoryBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/internal/users/{user_id}/:
    get:
      tags:
        - Internal
      operationId: getInternalUser
      summary: Look up a user for a trusted service
      description: |
        Returns the minimal user record other services need. This endpoint is
        only available with the shared service token; user access tokens are
        rejected.
      security:
        - serviceToken: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The user record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/companies/:
    get:
      tags:
        - Admin
      operationId: listAdminCompanies
      summary: List company accounts by verification status
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: true
          description: Verification status to list.
          schema:
            $ref: '#/components/schemas/VerificationStatus'
        - name: page
          in: query
          required: false
          description: Page number, 20 results per page.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A page of company accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCompanyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/companies/{company_id}/verify/:
    post:
      tags:
        - Admin
      operationId: verifyAdminCompany
      summary: Verify and activate a company account
      description: |
        Marks the company as verified, records the verifying administrator and
        timestamp, clears any rejection reason, and activates the account.
        Repeating the call is idempotent.
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          description: UUID of the company user account.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The updated company account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCompanySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/companies/{company_id}/reject/:
    post:
      tags:
        - Admin
      operationId: rejectAdminCompany
      summary: Reject a company account
      description: |
        Marks the company as rejected, stores the reason and deactivates the
        account.
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          description: UUID of the company user account.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRejectRequest'
      responses:
        '200':
          description: The updated company account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCompanySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users/:
    get:
      tags:
        - Admin
      operationId: listAdminUsers
      summary: List user accounts
      description: |
        Platform administrators see all accounts. University administrators
        see only students and supervisors of their own university.
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          description: Filter by authoritative role.
          schema:
            $ref: '#/components/schemas/Role'
        - name: q
          in: query
          required: false
          description: Case-insensitive search over name and email.
          schema:
            type: string
        - name: university
          in: query
          required: false
          description: Case-insensitive exact match on the institution.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number, 20 results per page.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A page of user accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Admin
      operationId: createAdminUser
      summary: Provision a user account
      description: |
        Creates a `student`, `company`, `university_admin` or `supervisor`
        account. Platform administrators may create any of these roles;
        university administrators may create only `student` and `supervisor`
        accounts in their own university. Provide either a password or
        `generate_password: true`, but not both. The generated password is
        returned once as `one_time_password`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      responses:
        '201':
          description: The provisioned account.
          headers:
            Location:
              description: Absolute URL of the created user.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users/{user_id}/:
    get:
      tags:
        - Admin
      operationId: getAdminUser
      summary: Read a user account
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The user account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Admin
      operationId: updateAdminUser
      summary: Activate, deactivate or verify a user account
      description: |
        Only `is_active` may be changed for non-company accounts. For company
        accounts, `verification_status` and `rejection_reason` are also
        accepted. A company must be verified before it can be activated, and a
        rejection requires a reason.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Admin
      operationId: deleteAdminUser
      summary: Delete a user account
      description: |
        Permanently removes a user account and its role profiles. Only platform
        administrators may delete accounts; university administrators can read
        and edit only their own institution's users.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The account was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token

  schemas:
    Health:
      type: object
      required:
        - status
        - service
      properties:
        status:
