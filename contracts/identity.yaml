          format: uuid
        name:
          type: string

    DirectoryBatchResult:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          description: Requested IDs that exist, in the requested order.
          items:
            $ref: '#/components/schemas/DirectoryBatchUser'

    AdminCompanySummary:
      type: object
      required:
        - id
        - name
        - email
        - role
        - is_active
        - verification_status
        - verified_by
        - verified_at
        - rejection_reason
        - legal_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - company
        is_active:
          type: boolean
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        verified_by:
          type: string
          format: uuid
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        rejection_reason:
          type: string
        legal_name:
          type: string

    AdminCompanyPage:
      type: object
      required:
        - count
        - next
        - previous
        - results
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminCompanySummary'

    CompanyRejectRequest:
      type: object
      required:
        - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1

    AdminUserSummary:
      type: object
      required:
        - id
        - name
        - email
        - role
        - is_active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
        verification_status:
          allOf:
            - $ref: '#/components/schemas/VerificationStatus'
          description: Present only for company accounts.
        verified_by:
          type: string
          format: uuid
          nullable: true
          description: Present only for company accounts.
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: Present only for company accounts.
        rejection_reason:
          type: string
          description: Present only for company accounts.

    AdminUserPage:
      type: object
      required:
        - count
        - next
        - previous
        - results
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'

    AdminUserCreateRequest:
      type: object
      required:
        - email
        - name
        - role
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/ProvisionableRole'
        password:
          type: string
          writeOnly: true
          maxLength: 128
          description: Required unless `generate_password` is true.
        generate_password:
          type: boolean
          default: false
          description: Generate a one-time password instead of supplying one.

    AdminUserCreateResponse:
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          properties:
            one_time_password:
              type: string
              description: Returned once when `generate_password` is true.

    AdminUserUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        is_active:
          type: boolean
        verification_status:
          allOf:
            - $ref: '#/components/schemas/VerificationStatus'
          description: Company accounts only.
        rejection_reason:
          type: string
          minLength: 1
          description: Company accounts only. Required when rejecting.

    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    ValidationError:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      example:
        email:
          - An account with this email address already exists.

  responses:
    BadRequest:
      description: The request body or query parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller lacks the required access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: The rate limit was exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The service cannot serve requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
