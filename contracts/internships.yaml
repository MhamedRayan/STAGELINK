openapi: 3.0.3

info:
  title: STAGELINK Internships API
  version: 0.3.0
  description: |
    HTTP contract for the STAGELINK internships service.

    This file is the source of truth for the service interface. Add or change
    operations here before implementing them in Django. See
    docs/api-conventions.md for shared rules.

    Internship identifiers and all cross-service references are UUID strings.
    Public reads and actions require a bearer access token. The internal create
    endpoint requires the shared X-Service-Token header.

    Changes in 0.3.0 (breaking for list consumers): GET /api/internships/ now
    returns the paginated envelope `{results, pagination}` instead of a bare array.

  contact:
    name: STAGELINK maintainers

servers:
  - url: http://localhost:8004
    description: Local development
  - url: https://api.stagelink.example/internships
    description: Reserved production URL

tags:
  - name: System
    description: Operational endpoints used by infrastructure.
  - name: Internships
    description: Internship records, visibility, lifecycle and supervision.
  - name: Internal
    description: Trusted service-to-service endpoints.

paths:
  /health/:
    get:
      tags:
        - System
      operationId: getInternshipsHealth
      summary: Report service health
      description: Returns the current liveness status of the internships service.
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/internal/internships/:
    post:
      tags:
        - Internal
      operationId: createInternship
      summary: Create an internship for an accepted application
      description: |
        Called by applications after a student accepts a validated offer. The
        source application identifier is the idempotency key: retrying the same
        request returns the existing internship with `200` instead of creating
        another row. The status is always set to `confirmed` by this service.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternshipCreate'
      responses:
        '201':
          description: A new internship was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
        '200':
          description: The internship already existed for this application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/internships/:
    get:
      tags:
        - Internships
      operationId: listInternships
      summary: List internships visible to the caller
      description: |
        Visibility is role-based: students see their own internships, companies
        see internships for their company, supervisors see assigned internships,
        and university administrators see all internships. Platform administrators
        see none. Filters only narrow the visible set; they never widen it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InternshipStatus'
        - name: student_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: company_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: supervisor_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: start_date_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: start_date_to
          in: query
          required: false
          description: Must not be before start_date_from.
          schema:
            type: string
            format: date
        - name: mine
          in: query
          required: false
          description: |
            Only the caller's own participation: student, company or assigned
            supervisor. Returns nothing for university and platform administrators.
          schema:
            type: boolean
            default: false
        - name: ordering
          in: query
          required: false
          schema:
            type: string
            enum:
              - created_at
              - -created_at
              - start_date
              - -start_date
            default: -created_at
      responses:
        '200':
          description: One page of internships visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternshipPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/internships/{id}/:
    parameters:
      - $ref: '#/components/parameters/InternshipId'
    get:
      tags:
        - Internships
      operationId: getInternship
      summary: Read an internship
      description: Internships outside the caller's visibility return `404`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The internship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internships/{id}/assign-supervisor/:
    parameters:
      - $ref: '#/components/parameters/InternshipId'
    post:
      tags:
        - Internships
      operationId: assignSupervisor
      summary: Assign or reassign the supervisor of an internship
      description: |
        Restricted to university administration. The supervisor is verified with
        the Identity directory: the user must exist, be active and have role
        `supervisor`. The internship must be `confirmed` or `in_progress`.
        Reassigning requires a reason. Assigning the same supervisor again changes
        nothing. Every change is recorded in the history.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisorAssignment'
      responses:
        '200':
          description: The updated internship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
        '400':
          description: Invalid supervisor, or a reason is required to reassign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/internships/{id}/start/:
    parameters:
      - $ref: '#/components/parameters/InternshipId'
    post:
      tags:
        - Internships
      operationId: startInternship
      summary: Start an internship manually
      description: |
        Restricted to university administration. The internship moves from
        `confirmed` to `in_progress`, but only on or after its start date. The
        scheduled job makes the same change automatically on that date.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The updated internship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/internships/{id}/complete/:
    parameters:
      - $ref: '#/components/parameters/InternshipId'
    post:
      tags:
        - Internships
      operationId: completeInternship
      summary: Complete an internship
      description: |
        Moves an `in_progress` internship to `completed`. Allowed for the assigned
        supervisor and for university administration. Requires an approved
        evaluation: until the evaluation feature exists, this always returns `409`
        with `evaluation_required`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The updated internship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Internship'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/internships/{id}/history/:
    parameters:
      - $ref: '#/components/parameters/InternshipId'
    get:
      tags:
        - Internships
      operationId: getInternshipHistory
      summary: Read the history of an internship
      description: |
        Available to every caller who can see the internship: university
        administration, the assigned supervisor, and the student and company on it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: History entries in chronological order.
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternshipAudit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token

  parameters:
    InternshipId:
      name: id
      in: path
      required: true
      description: Internship UUID.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    Health:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          example: internships

    InternshipStatus:
      type: string
      enum:
        - confirmed
        - in_progress
        - completed
        - cancelled

    InternshipCreate:
      type: object
      required:
        - source_application_id
        - student_user_id
        - company_user_id
        - offer_id
        - start_date
        - end_date
      properties:
        source_application_id:
          type: string
          format: uuid
        student_user_id:
          type: string
          format: uuid
        company_user_id:
          type: string
          format: uuid
        offer_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    SupervisorAssignment:
      type: object
      required:
        - supervisor_user_id
      properties:
        supervisor_user_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
          description: Required when reassigning an internship that already has a supervisor.

    Internship:
      type: object
      required:
        - id
        - source_application_id
        - student_user_id
        - company_user_id
        - offer_id
        - start_date
        - end_date
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        source_application_id:
          type: string
          format: uuid
        student_user_id:
          type: string
          format: uuid
        company_user_id:
          type: string
          format: uuid
        offer_id:
          type: string
          format: uuid
        supervisor_user_id:
          type: string
          format: uuid
          nullable: true
        supervisor_assigned_by_user_id:
          type: string
          format: uuid
          nullable: true
        supervisor_assigned_at:
          type: string
          format: date-time
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/InternshipStatus'
        created_at:
          type: string
          format: date-time

    InternshipPage:
      type: object
      required:
        - results
        - pagination
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Internship'
        pagination:
          type: object
          required:
            - limit
            - offset
            - total
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer

    InternshipAudit:
      type: object
      required:
        - id
        - action
        - reason
        - at
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - created
            - status_changed
            - supervisor_assigned
            - supervisor_reassigned
        from_status:
          $ref: '#/components/schemas/InternshipStatus'
        to_status:
          $ref: '#/components/schemas/InternshipStatus'
        from_supervisor_user_id:
          type: string
          format: uuid
          nullable: true
        to_supervisor_user_id:
          type: string
          format: uuid
          nullable: true
        actor_user_id:
          type: string
          format: uuid
          nullable: true
          description: Null when the system (scheduled job) made the change.
        reason:
          type: string
        at:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          enum:
            - invalid_request
            - validation_error
            - unauthenticated
            - permission_denied
            - not_found
            - method_not_allowed
            - active_internship_conflict
            - invalid_status_transition
            - evaluation_required
            - start_date_not_reached
            - invalid_internship_state
            - reason_required
            - invalid_supervisor
            - identity_unavailable
          example: start_date_not_reached
        message:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller lacks the required access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state of the internship.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: A dependency (Identity) or this service cannot serve the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
