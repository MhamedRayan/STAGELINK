openapi: 3.0.3

info:
  title: STAGELINK Applications API
  version: 0.3.0
  description: |
    HTTP contract for the STAGELINK applications service.

    This file is the source of truth for the service interface. Add or change
    operations here before implementing them in Django. See
    docs/api-conventions.md for shared rules.

    Application identifiers and all cross-service references are UUID strings.
    The owning company is identified by `company_user_id`, matching the offers
    and internships services. All user endpoints require a bearer access token
    issued by identity. Internal endpoints under `/api/internal/` accept only
    the shared `X-Service-Token` header.

    Errors use the shared envelope `{code, message, details}`. Conflict codes
    include `OFFER_UNAVAILABLE`, `CAPACITY_FULL`, `INVALID_STATE`,
    `INTERNSHIP_CONFLICT` and `DUPLICATE_APPLICATION`.

  contact:
    name: STAGELINK maintainers

servers:
  - url: http://localhost:8003
    description: Local development
  - url: https://api.stagelink.example/applications
    description: Reserved production URL

tags:
  - name: System
    description: Operational endpoints used by infrastructure.
  - name: Applications
    description: Application submission, decisions, withdrawal and confirmation.
  - name: Internal
    description: Service-to-service endpoints guarded by X-Service-Token.

paths:
  /health/:
    get:
      tags:
        - System
      operationId: getApplicationsHealth
      summary: Report service health
      description: Returns the current liveness status of the applications service.
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/applications/:
    get:
      tags:
        - Applications
      operationId: listApplications
      summary: List applications visible to the caller
      description: |
        Students see their own applications, companies see applications owned by
        their company, and university or platform administrators see all
        applications. Results are paginated and can be filtered. A university
        administrator uses `?status=COMPANY_ACCEPTED` as the validation queue.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/OfferIdFilter'
        - $ref: '#/components/parameters/StudentIdFilter'
        - $ref: '#/components/parameters/CompanyIdFilter'
        - $ref: '#/components/parameters/CreatedAfterFilter'
        - $ref: '#/components/parameters/CreatedBeforeFilter'
        - $ref: '#/components/parameters/Ordering'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of applications visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Applications
      operationId: createApplication
      summary: Submit an application
      description: |
        Only students can submit applications. The offer is validated with the
        offers service: it must exist, be `published`, and have a future
        deadline. The owning `company_user_id` is derived from the offer and must
        not be sent by the caller. Duplicate applications for the same offer are
        rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: The application was submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: |
            Invalid input, duplicate application, or the offer does not exist
            (`OFFER_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The offer is not accepting applications (`OFFER_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The offers service is unavailable (`OFFERS_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/applications/{id}/:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
        - Applications
      operationId: getApplication
      summary: Read an application
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/applications/{id}/history/:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
        - Applications
      operationId: listApplicationHistory
      summary: Read the transition history of an application
      description: |
        Append-only audit trail. Visible to the student, the owning company,
        university administrators and platform administrators.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of history entries, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationHistoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/applications/{id}/company-decision/:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
        - Applications
      operationId: decideAsCompany
      summary: Accept or reject an application as the company
      description: |
        Only the owning company can decide, and only while the application is
        `SUBMITTED`. Acceptance reserves one place on the offer and returns
        `409 CAPACITY_FULL` when no place is available.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyDecision'
      responses:
        '200':
          description: The updated application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `INVALID_STATE` when the application is no longer `SUBMITTED`,
            `CAPACITY_FULL` when the offer has no place left, or
            `OFFER_UNAVAILABLE` when the offer is closed or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The offers service is unavailable (`OFFERS_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/applications/{id}/university-decision/:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
        - Applications
      operationId: decideAsUniversity
      summary: Validate or reject an application as a university administrator
      description: |
        Allowed only while the application is `COMPANY_ACCEPTED`. Rejection
        releases the provisional reservation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniversityDecision'
      responses:
        '200':
          description: The updated application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The application is not `COMPANY_ACCEPTED` (`INVALID_STATE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/applications/{id}/student-decision/:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
        - Applications
      operationId: decideAsStudent
      summary: Accept or decline a validated application as the student
      description: |
        Allowed only while the application is `UNIVERSITY_VALIDATED`.

        Declining releases the reservation. Accepting commits `STUDENT_ACCEPTED`
        and then calls the internships service, outside the database
        transaction. When the internship is created the application becomes
        `CONFIRMED`, one place moves from `reserved` to `occupied`, and the
        student's other open applications are withdrawn automatically.

        A permanent internships conflict returns `409 INTERNSHIP_CONFLICT` and
        restores `UNIVERSITY_VALIDATED`. A transient failure returns
        `503 DOWNSTREAM_UNAVAILABLE` and leaves `STUDENT_ACCEPTED` so the
        reconciliation command can retry safely.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentDecision'
      responses:
        '200':
          description: The updated application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `INVALID_STATE` when the application is not validated, or
            `INTERNSHIP_CONFLICT` when the student already has an active
            internship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Internships is unavailable (`DOWNSTREAM_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/applications/{id}/withdraw/:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
        - Applications
      operationId: withdrawApplication
      summary: Withdraw an application as the student
      description: |
        The owning student can withdraw while the application is `SUBMITTED`,
        `COMPANY_ACCEPTED`, `UNIVERSITY_VALIDATED` or `STUDENT_ACCEPTED`.
        Withdrawal releases any provisional place. Terminal states return
        `409 INVALID_STATE`.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Withdrawal'
      responses:
        '200':
          description: The withdrawn application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The application cannot be withdrawn in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/internal/applications/{id}/release-place/:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags:
        - Internal
      operationId: releaseApplicationPlace
      summary: Release the place held by an application
      description: |
        Called by the internships service after an approved cancellation.
        Idempotent: the first call frees the place and stores `place_released_at`;
        later calls return `released: false` without freeing anything again.
      security:
        - serviceToken: []
      responses:
        '200':
          description: The release result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasePlaceResult'
        '403':
          $ref: '#/components/responses/InternalForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/internal/offers/{offer_id}/capacity/:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    get:
      tags:
        - Internal
      operationId: getOfferCapacity
      summary: Read the committed places on an offer
      description: |
        Called by the offers service before allowing a capacity reduction.
        `committed` is `reserved + occupied`. `capacity` and `available` are null
        when Applications has no reservation row yet, which means nothing is
        committed.
      security:
        - serviceToken: []
      responses:
        '200':
          description: The capacity snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferCapacity'
        '403':
          $ref: '#/components/responses/InternalForbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token

  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      description: Application UUID.
      schema:
        type: string
        format: uuid

    OfferId:
      name: offer_id
      in: path
      required: true
      description: Offer UUID owned by the offers service.
      schema:
        type: string
        format: uuid

    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ApplicationStatus'

    OfferIdFilter:
      name: offer_id
      in: query
      required: false
      schema:
        type: string
        format: uuid

    StudentIdFilter:
      name: student_user_id
      in: query
      required: false
      schema:
        type: string
        format: uuid

    CompanyIdFilter:
      name: company_user_id
      in: query
      required: false
      schema:
        type: string
        format: uuid

    CreatedAfterFilter:
      name: created_after
      in: query
      required: false
      schema:
        type: string
        format: date-time

    CreatedBeforeFilter:
      name: created_before
      in: query
      required: false
      schema:
        type: string
        format: date-time

    Ordering:
      name: ordering
      in: query
      required: false
      description: Prefix with `-` for descending order. Defaults to `-created_at`.
      schema:
        type: string
        enum:
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          - status
          - -status
          - start_date
          - -start_date
          - end_date
          - -end_date

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    Health:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          example: applications

    ApplicationStatus:
      type: string
      enum:
        - SUBMITTED
        - COMPANY_ACCEPTED
        - COMPANY_REJECTED
        - UNIVERSITY_VALIDATED
        - UNIVERSITY_REJECTED
        - STUDENT_ACCEPTED
        - STUDENT_DECLINED
        - CONFIRMED
        - WITHDRAWN

    CompanyDecisionValue:
      type: string
      enum:
        - ACCEPT
        - REJECT

    StudentDecisionValue:
      type: string
      enum:
        - ACCEPT
        - DECLINE

    ApplicationCreate:
      type: object
      required:
        - offer_id
        - start_date
        - end_date
      properties:
        offer_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    Application:
      type: object
      required:
        - id
        - offer_id
        - company_user_id
        - student_user_id
        - start_date
        - end_date
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        offer_id:
          type: string
          format: uuid
        company_user_id:
          type: string
          format: uuid
        student_user_id:
          type: string
          format: uuid
        university_user_id:
          type: string
          format: uuid
          nullable: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        company_decision:
          $ref: '#/components/schemas/CompanyDecisionValue'
        company_reason:
          type: string
          nullable: true
        university_decision:
          $ref: '#/components/schemas/CompanyDecisionValue'
        university_reason:
          type: string
          nullable: true
        student_decision:
          $ref: '#/components/schemas/StudentDecisionValue'
        withdrawal_reason:
          type: string
          nullable: true
        withdrawn_at:
          type: string
          format: date-time
          nullable: true
        place_released_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Pagination:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        total:
          type: integer
          example: 42

    ApplicationList:
      type: object
      required:
        - results
        - pagination
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ApplicationStatusHistory:
      type: object
      required:
        - id
        - from_status
        - to_status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        from_status:
          type: string
          example: SUBMITTED
        to_status:
          $ref: '#/components/schemas/ApplicationStatus'
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        actor_role:
          type: string
          example: student
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    ApplicationHistoryList:
      type: object
      required:
        - results
        - pagination
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationStatusHistory'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CompanyDecision:
      type: object
      required:
        - decision
      properties:
        decision:
          $ref: '#/components/schemas/CompanyDecisionValue'
        reason:
          type: string
          description: Required when the decision is `REJECT`.

    UniversityDecision:
      type: object
      required:
        - decision
      properties:
        decision:
          $ref: '#/components/schemas/CompanyDecisionValue'
        reason:
          type: string
          description: Required when the decision is `REJECT`.

    StudentDecision:
      type: object
      required:
        - decision
      properties:
        decision:
          $ref: '#/components/schemas/StudentDecisionValue'

    Withdrawal:
      type: object
      properties:
        reason:
          type: string
          maxLength: 2000
          description: Optional free-text reason stored on the application.

    OfferCapacity:
      type: object
      required:
        - offer_id
        - reserved
        - occupied
        - committed
      properties:
        offer_id:
          type: string
          format: uuid
        capacity:
          type: integer
          nullable: true
        reserved:
          type: integer
        occupied:
          type: integer
        committed:
          type: integer
        available:
          type: integer
          nullable: true

    ReleasePlaceResult:
      type: object
      required:
        - id
        - offer_id
        - released
      properties:
        id:
          type: string
          format: uuid
        offer_id:
          type: string
          format: uuid
        released:
          type: boolean
        place_released_at:
          type: string
          format: date-time
          nullable: true

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: CAPACITY_FULL
        message:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller lacks the required access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalForbidden:
      description: The internal service token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The service cannot serve requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
