openapi: 3.0.3

info:
  title: STAGELINK Offers API
  version: 0.3.0
  description: |
    HTTP contract for the STAGELINK offers service.

    This file is the source of truth for the service interface. Add or change
    operations here before implementing them in Django. See
    docs/api-conventions.md for shared rules.

    Offer identifiers and the owning company identifier are UUID strings.
    User endpoints require a bearer access token issued by identity.
    Company roles are lowercase snake_case.

  contact:
    name: STAGELINK maintainers

servers:
  - url: http://localhost:8002
    description: Local development
  - url: https://api.stagelink.example/offers
    description: Reserved production URL

tags:
  - name: System
    description: Operational endpoints used by infrastructure.
  - name: Offers
    description: Company offers and their lifecycle.

paths:
  /health/:
    get:
      tags:
        - System
      operationId: getOffersHealth
      summary: Report service health
      description: Returns the current liveness status of the offers service.
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/offers/:
    get:
      tags:
        - Offers
      operationId: listOffers
      summary: List published offers, or the caller's own offers
      description: >-
        Returns published offers only by default (public, no authentication).
        With mine=true the caller must be a company; the response then contains
        that company's own offers of every status (soft-deleted drafts excluded).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: mine
          in: query
          description: When true, list the authenticated company's own offers (any status). Requires a company token.
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          description: Filter by status. On the public list only published offers exist, so draft or closed returns an empty page.
          schema:
            $ref: '#/components/schemas/OfferStatus'
        - name: ordering
          in: query
          description: Sort order. Default is -created_at.
          schema:
            type: string
            enum: [deadline, -deadline, created_at, -created_at]
        - name: deadline_after
          in: query
          description: Only offers whose deadline is strictly after this ISO 8601 date or datetime (a date means 00:00 UTC).
          schema:
            type: string
        - name: search
          in: query
          description: Case-insensitive search across title, description, requirements and location.
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: requirements
          in: query
          schema:
            type: string
        - name: company_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: A page of published offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOffers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Offers
      operationId: createOffer
      summary: Create a draft offer
      description: The owning company is the authenticated caller. The company role is required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferWrite'
      responses:
        '201':
          description: The offer was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/offers/{id}/:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    get:
      tags:
        - Offers
      operationId: getOffer
      summary: Read an offer
      description: Published offers are public. Draft and closed offers are visible only to their owner.
      responses:
        '200':
          description: The offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Offers
      operationId: updateOffer
      summary: Partially update an offer
      description: >-
        Only the owning company can update an offer. Closed offers cannot be edited.
        While published, title and location cannot change. Capacity may increase,
        and may decrease only down to the number of committed places reported by
        Applications. A reduction below that number returns 409; if Applications
        cannot be reached the reduction fails closed with 503.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferWrite'
      responses:
        '200':
          description: The updated offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Offers
      operationId: deleteOffer
      summary: Soft delete a draft offer
      description: Only the owning company can delete, and only draft offers. The offer then returns 404.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/internal/offers/{id}/:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    get:
      tags:
        - Offers
      operationId: getOfferInternal
      summary: Look up an offer (service-to-service)
      description: Returns a non-deleted offer of any status. Requires the X-Service-Token header; user JWTs are not accepted.
      security:
        - serviceToken: []
      responses:
        '200':
          description: The offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferInternal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/offers/{id}/publish/:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    post:
      tags:
        - Offers
      operationId: publishOffer
      summary: Publish a draft offer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The published offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/offers/{id}/close/:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    post:
      tags:
        - Offers
      operationId: closeOffer
      summary: Close a published offer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The closed offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token

  parameters:
    OfferId:
      name: id
      in: path
      required: true
      description: Offer UUID.
      schema:
        type: string
        format: uuid

  schemas:
    Health:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          example: offers

    OfferStatus:
      type: string
      enum:
        - draft
        - published
        - closed

    OfferWrite:
      type: object
      required:
        - title
        - description
        - requirements
        - location
        - deadline
        - capacity
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        requirements:
          type: string
        location:
          type: string
          maxLength: 255
        deadline:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1

    Offer:
      allOf:
        - $ref: '#/components/schemas/OfferWrite'
        - type: object
          required:
            - id
            - company_user_id
            - status
            - created_at
            - updated_at
          properties:
            id:
              type: string
              format: uuid
            company_user_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/OfferStatus'
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    OfferInternal:
      type: object
      required: [id, company_user_id, title, status, deadline, capacity, created_at]
      properties:
        id:
          type: string
          format: uuid
        company_user_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/OfferStatus'
        deadline:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time

    PaginatedOffers:
      type: object
      required:
        - count
        - next
        - previous
        - results
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Offer'

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: offer_state_conflict
        message:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller lacks the required access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The offer's current state does not allow this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The service cannot serve requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'