# Single-origin deployment: the SPA and every public API share one host.
# Internal service-to-service routes are never exposed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m; # 10 MiB submissions plus multipart overhead.

    # SPA fallback: /login, /app/... and deep links all serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/svc/[^/]+/api/internal/ {
        return 404;
    }

    location /svc/identity/ {
        proxy_pass http://identity:8000/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /svc/offers/ {
        proxy_pass http://offers:8000/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /svc/applications/ {
        proxy_pass http://applications:8000/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /svc/internships/ {
        proxy_pass http://internships:8000/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /svc/notifications/ {
        proxy_pass http://notifications:8000/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
